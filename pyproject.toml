[project]
name = "bordeaux-multi-asset-lab"
version = "0.1.0"
description = "Active multi-asset portfolio management framework with macro regime detection and AI co-pilot."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "TTB10" }
]
keywords = ["asset-management", "portfolio", "quantitative-finance", "macro", "multi-asset"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # Core data
    "pandas>=2.2",
    "numpy>=1.26",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    # Market & macro data
    "yfinance>=0.2.40",
    "requests>=2.32",
    # Quant & stats
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    # Optimization
    "cvxpy>=1.5",
    # Visualisation
    "plotly>=5.22",
    "matplotlib>=3.9",
    # App
    "streamlit>=1.36",
    # Validation & config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # Utilities
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "fredapi>=0.5.2",
]

[project.optional-dependencies]
ai = [
    "pydantic-ai>=0.0.13",
    "openai>=1.40",
    "anthropic>=0.34",
]
reporting = [
    "jinja2>=3.1",
    "weasyprint>=62.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "types-pyyaml>=6.0.12.20260408",
]

[project.urls]
Homepage = "https://github.com/TTB10/bordeaux-multi-asset-lab"
Repository = "https://github.com/TTB10/bordeaux-multi-asset-lab"
Issues = "https://github.com/TTB10/bordeaux-multi-asset-lab/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bml"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = ["E501"]  # line length geree par formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=bml",
    "--cov-report=term-missing",
]
